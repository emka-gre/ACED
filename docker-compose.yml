services:
  # The service itself: API and analysis workers in one container.
  #
  # One container, one origin: it serves the API and the built web app together, which is
  # what hash-based routing in the frontend buys — a static mount, no rewrite rules.
  #
  # Workers are threads inside the API process, not a second service — the queue is
  # in-process by design (see api/services/queue.py), so there is no broker to run and
  # nothing to scale independently yet. When the queue grows a real backend, this file
  # gains a `worker` service running the same image with a different command, and
  # nothing else about the deployment changes.
  #
  # Usage:
  #   docker compose up api
  #   open http://localhost:8000        # the web app
  #   curl localhost:8000/health
  api:
    build:
      context: .
      target: service
    platform: linux/amd64
    ports:
      - "8000:8000"
    environment:
      # The shipped bundles come in with the source, so this path resolves inside the
      # image. Naming it explicitly rather than relying on the default is what lets a
      # deployment mount a different bundle and change one variable to use it.
      ACED_BUNDLE: /app/models/lstm-arm-technique/v1
      ACED_STORAGE_ROOT: /app/storage
      ACED_MAX_UPLOAD_MB: "200"
      ACED_RETENTION_HOURS: "24"
      ACED_WORKERS: "2"
      ACED_WEB_ROOT: /app/web/dist
    volumes:
      # Deliberately no bind mount of the repository. This runs what the image was built
      # with — including the frontend build, which a mounted working copy would shadow with
      # whatever `web/dist` happens to hold locally, or with nothing at all. Rebuild to
      # deploy a change; the `dev` service below is the one that picks up edits live.
      #
      # Uploaded climbs and rendered overlays go to a named volume: this is footage of
      # identifiable people, and it should not accumulate in a working copy where it can be
      # committed or synced by accident.
      - aced-storage:/app/storage
    healthcheck:
      # The service answers 503 until its bundle is loaded, so this is a real readiness
      # check and not just "is the port open".
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Dev shell: the pinned Python 3.11 / mediapipe / tensorflow environment, with the
  # repo mounted so edits on the host are picked up without rebuilding the image.
  # Usage:
  #   docker compose build dev
  #   docker compose run --rm dev bash
  #   docker compose run --rm dev pytest -m "not slow"
  #   docker compose run --rm dev pytest -m parity
  dev:
    build:
      context: .
      # Stops before the frontend build: the dev shell runs the Python suites and has no use
      # for built assets, and waiting on npm to start a shell would be a poor trade.
      target: runtime
    platform: linux/amd64
    volumes:
      - .:/app
    working_dir: /app
    command: sleep infinity

volumes:
  aced-storage:
