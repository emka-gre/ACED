[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aced"
version = "0.1.0"
description = "Arm-technique analysis for bouldering video"
readme = "README.md"
license = { file = "LICENSE" }
# mediapipe 0.10.21 publishes no wheels above CPython 3.12. The research was done on
# 3.11; do not widen this without re-establishing numerical parity first.
requires-python = ">=3.11,<3.13"

dependencies = [
    # Pinned exactly: the shipped models were fitted under these versions and this
    # change does not attempt a dependency upgrade. See openspec design notes.
    "mediapipe==0.10.21",
    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
    "pandas>=2.1,<2.3",
    "scikit-learn>=1.4,<1.8",
    # TensorFlow is the Keras backend only. 2.16.2 is the last release with macOS x86-64
    # wheels, and development happens on an Intel Mac, so it is the ceiling for everyone —
    # a parity reference is only worth having if CI and the laptop run the same versions.
    "tensorflow==2.16.2",
    # LSTM_model.keras was written by Keras 3.12.1, which is newer than the Keras bundled
    # with TF 2.16. Keras 3 is installed standalone so the reader matches the writer.
    "keras>=3.12,<3.13",
    "joblib>=1.3",
    "pydantic>=2.6",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
explain = [
    # SHAP is an opt-in enrichment, never on the hot path.
    "shap>=0.45",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
    "pandas-stubs",
    "types-tqdm",
]

[project.scripts]
aced = "aced.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["aced"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["aced", "api", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "N806",  # research-derived code uses X_train-style names in a few places
]

[tool.ruff.lint.isort]
# Without this, `aced` is treated as third-party in tests and gets merged into the
# third-party import block.
known-first-party = ["aced", "api"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# None of these ship type information.
module = ["mediapipe.*", "cv2.*", "sklearn.*", "joblib.*", "keras.*", "tensorflow.*", "shap.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "parity: compares packaged output against recorded research-pipeline output",
    "slow: requires MediaPipe or model inference over a real video",
]
